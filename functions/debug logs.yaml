  "name": "Death Record",
  "template": "[divbox=#FFFFFF]\n[center][img]https://i.ibb.co/Rk5bRDxX/image.png[/img][/center]\n[/divbox]\n\n[divbox=#4D4D4D][center][bold][size=150]PUBLIC DECEDENT RECORD[/size][/bold][/center][/divbox]\n\n[divbox=#000000][center][size=130]{{decedentName}}[/size][/center]\n[center]Date of Death: {{formattedDateOfDeath}}[/center]\n[center]Age: {{age}} [/center][/divbox]\n\n[table]\n[tr]\n[td bgcolor=#E6E6E6][bold]Case Number[/bold]: {{caseNumber}}[/td]\n[td bgcolor=#E6E6E6][bold]Case Status[/bold]: {{coldCaseStatus}}[/td]\n[td bgcolor=#E6E6E6][bold]Body Status[/bold]: {{bodyStatus}}[/td]\n[/tr]\n[tr]\n[td bgcolor=#E6E6E6][bold]Sex[/bold]: {{sex}}[/td]\n[td bgcolor=#E6E6E6][bold]Ethnicity[/bold]: {{ethnicity}}[/td]\n[/tr]\n[/table]\n\n[table]\n[tr]\n[td bgcolor=#E6E6E6][bold]Place of Death[/bold]: {{placeOfDeath}}[/td]\n[td bgcolor=#E6E6E6][bold]Manner[/bold]: {{Manner}}[/td]\n[/tr]\n[tr]\n[td bgcolor=#E6E6E6][bold]Investigator[/bold]: {{selectEmployee}} [/td]\n[td bgcolor=#E6E6E6][bold]Chief Medical Examiner[/bold]: Anne Carter[/td]\n[/tr]\n[/table]\n\n[conditional field=\"deathRecordType\" value=\"Identified\"] \n[table]\n[tr]\n[td bgcolor=#E6E6E6][bold]Cause A[/bold]: {{causeA}}[/td]\n[td bgcolor=#E6E6E6][bold]Cause B[/bold]: {{causeB}}[/td]\n[/tr]\n[tr]\n[td bgcolor=#E6E6E6][bold]Cause C[/bold]: {{causeC}}[/td]\n[td bgcolor=#E6E6E6][bold]Cause D[/bold]: {{causeD}}[/td]\n[/tr]\n[tr]\n[td bgcolor=#E6E6E6][bold]Other Significant Conditions[/bold]: {{otherSignificantConditions}}[/td]\n[/tr]\n[/table]\n[/conditional]\n[conditional field=\"deathRecordType\" value=\"Unidentified\"][table]\n[tr]\n[td bgcolor=#E6E6E6][bold]Hair Color[/bold]: {{hairColor}}[/td]\n[td bgcolor=#E6E6E6][bold]Eye Color[/bold]: {{eyeColor}}[/td]\n[/tr]\n[tr]\n[td bgcolor=#E6E6E6][bold]Weight[/bold]: {{weight}}[/td]\n[td bgcolor=#E6E6E6][bold]Height[/bold]: {{height}}[/td]\n[/tr]\n[tr]\n[td bgcolor=#E6E6E6][bold]Tattoos[/bold]: {{tattoos}}[/td]\n[td bgcolor=#E6E6E6][bold]Jewelry[/bold]: {{jewelry}}[/td]\n[/tr]\n[tr]\n[td bgcolor=#E6E6E6][bold]Comments[/bold]: {{comments}}[/td]\n[/tr]\n[/table]\n[/conditional]\n[divbox=#4D4D4D][center][bold]These public records are of disclosed cases involving a Medical Examiner from the Department of Pathology & Forensic Medicine only. \nThese are not records of every death that occurs in Los Santos County.\n\nFor further inquiries into any cases or for further documentation:\nThe Chief/Deputy Chief Medical Examiner-Coroner can be emailed through PHMC's online portal [url=https://phmc.gta.world/ucp.php?i=pm&mode=compose]HERE[/url].\nPHMC's landline can be reached through the number 50056 for any physical records or the next-of-kin process.[/bold][/center][/divbox]",
  "titleGeneratorCode": "[CASE #YEAR-{{caseNumber}}]  {{decedentName}} (({{decedentOOC}})) | {{formattedDateOfDeath}}\n"
