name: Deploy to GitHub Pages

on:
  push:
    branches: [source]

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          clean: true
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          git init
          git config user.name "Deploy Bot"
          git config user.email "bot@phmc.local"
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/gtaw-forms/forms.git
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy $(date)"
          git push origin gh-pages --force
