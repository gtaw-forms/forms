name: Deploy to GitHub Pages

on:
  push:
    branches: [source]

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          cd build
          git init
          git config user.name "Deploy Bot"
          git config user.email "bot@phmc.local"
          git remote add origin https://github.com/gtaw-forms/forms.git
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy $(date)"
          git push origin gh-pages --force
