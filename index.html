<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Resource hints for faster loading -->
    <link rel="dns-prefetch" href="https://gtaw-forms.github.io" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://gtaw-forms.github.io" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    
    <meta
      name="description"
      content="PHMC Tools"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Open Graph fallback (also feeds the Discord link preview) -->
    <meta property="og:title" content="PHMC Tools" />
    <meta property="og:description" content="An all-in-one interactive website for the GTA World ENG faction Pillbox Hill Medical Center — morgue records and paperwork tools." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gtaw-forms.github.io/forms/" />
    <meta property="og:image" content="https://gtaw-forms.github.io/forms/phmc-logo.png" />

    <!-- Discord component embed (discord/discord-api-docs#8606): replaces the
      generic link card with a branded layout. Static by necessity — Discord's
      crawler reads raw HTML with no JS, and Pages serves one index.html for
      all routes — so this is one generic card for every site link.
      NOTE: this block lives in SOURCE (it was previously hand-injected into
      deploy output and wiped by the next deploy — c02a886, 2026-09-23). -->
    <script id="discord:component-embed" type="application/json">
    {
      "component": {
        "type": 17,
        "accent_color": 48340,
        "components": [
          {
            "type": 9,
            "components": [
              {
                "type": 10,
                "content": "# Welcome to PHMC Tools\nAn all-in-one interactive website for the GTA World ENG faction Pillbox Hill Medical Center — morgue records and paperwork tools."
              }
            ],
            "accessory": {
              "type": 11,
              "media": { "url": "https://gtaw-forms.github.io/forms/phmc-logo.png" }
            }
          },
          {
            "type": 1,
            "components": [
              { "type": 2, "style": 5, "label": "Open PHMC Tools", "url": "https://gtaw-forms.github.io/forms/" },
              { "type": 2, "style": 5, "label": "Morgue Records", "url": "https://gtaw-forms.github.io/forms/#/morgue" },
              { "type": 2, "style": 5, "label": "Paperwork Tools", "url": "https://gtaw-forms.github.io/forms/#/ui-prototype" },
              { "type": 2, "style": 5, "label": "Tow Reports", "url": "https://gtaw-forms.github.io/forms/#/tow" }
            ]
          }
        ]
      }
    }
    </script>
    <!--
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>PHMC Tools </title>
    <script>
      if (window.location.hostname === "localhost" || window.location.hostname.startsWith("192.")) {
        document.title = "DEV:PHMC";
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
