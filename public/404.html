<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
        // This script redirects all 404s to the root of the single-page app,
        // passing the originally requested path via sessionStorage.

        // Store the path the user tried to access (e.g., /forms/cctv).
        sessionStorage.setItem('redirectPath', window.location.pathname);

        // Redirect to the absolute base path of the application.
        // For gtaw-forms.github.io/forms/, this is '/forms/'.
        window.location.replace('/forms/');
    </script>
</head>
<body>
    <p>If you are not being redirected, please <a href="/forms/">click here to go to the homepage</a>.</p>
</body>
</html>
