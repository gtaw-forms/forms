<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Page Not Found</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script redirects all 404s to the root index.html with the original path as a query parameter.
        // Your React app's router should then read this query parameter and handle the route.

        // Get the current path (e.g., /forms/bingo)
        var path = window.location.pathname;

        // IMPORTANT: Adjust this 'basename' to match your GitHub Pages deployment path.
        // If your app is at https://yourusername.github.io/your-repo-name/, then basename is '/your-repo-name/'.
        // If your app is at https://yourdomain.com/ (custom domain at root), then basename is '/'.
        // Based on your package.json homepage, it should be '/forms/'.
        var basename = '/forms/'; 

        // Construct the new URL to redirect to: /forms/index.html?p=/forms/bingo
        var redirectUrl = basename + 'index.html?p=' + encodeURIComponent(path);

        // Replace the current history entry with the redirect URL.
        // This prevents the original 404 URL from being in the browser history.
        window.history.replaceState(null, null, redirectUrl);

        // Redirect to the new URL.
        window.location.replace(redirectUrl);
    </script>
</head>
<body>
    If you are not redirected automatically, follow this <a href="/">link to the homepage</a>.
</body>
</html>
